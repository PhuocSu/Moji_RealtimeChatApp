server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    access_log /var/log/nginx/access.log main;

    # Docker Swarm internal DNS resolver — bắt buộc phải có
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    # Bật gzip compression (giảm bandwidth ~70%)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # Cache static assets lâu (file có hash trong tên, ví dụ main.abc123.js)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires     1y;
        add_header  Cache-Control "public, immutable";
        access_log  off;
    }

    # Kết nối với backend sau khi build và pull image về
    # --- Proxy API sang backend (Docker network nội bộ) ---
    location /api/ {
        # Dùng biến → nginx resolve lúc request, không phải lúc startup
        set $backend_url http://moji-chat_backend:5001; #Đặt tên theo <stack_name>_<service_name: Swarm sau này sẽ gộp tên
        proxy_pass         $backend_url; 
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        # Log riêng cho API
        access_log /var/log/nginx/api_access.log main;
    }

    # --- Proxy Socket.IO sang backend (cần header Upgrade cho websocket) ---
    location /socket.io/ {
        # Dùng biến → nginx resolve lúc request, không phải lúc startup
        set $backend_url http://moji-chat_backend:5001;
        proxy_pass         $backend_url;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        # Log riêng cho websocket
        access_log /var/log/nginx/socket_access.log main;
    }

    # React Router — mọi route đều trả về index.html
    # (React tự xử lý routing phía client)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ẩn version nginx khỏi response header
    server_tokens off;
}
