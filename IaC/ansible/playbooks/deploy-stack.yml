- name: Deploy application stack to Swarm
  hosts: managers    # chỉ chạy trên manager node
  become: true

  tasks:
    - name: Ensure /app directory exists
      file:
        path: /home/{{ ansible_user }}/app
        state: directory
        owner: "{{ ansible_user }}"

    - name: Copy docker-compose file to manager
      copy:
        src: ../../../docker-compose.yml
        dest: /home/{{ ansible_user }}/app/docker-compose.yml
        owner: "{{ ansible_user }}"

    - name: Install pip3 if not present
      apt:
        name: python3-pip
        state: present
      when: ansible_os_family == "Debian"

    - name: Install jsondiff via pip3
      pip:
        name: jsondiff
        executable: pip3

    - name: Deploy stack
      community.docker.docker_stack:
        state: present
        name: "{{ APP_NAME }}"
        compose:
          - /home/{{ ansible_user }}/app/docker-compose.yml
      environment:
        DOCKERHUB_USERNAME: "{{ DOCKERHUB_USERNAME }}"
        MONGODB_CONNECTION_STRING: "{{ MONGODB_CONNECTION_STRING }}"
        ACCESS_TOKEN_SECRET: "{{ ACCESS_TOKEN_SECRET }}"
        CLOUDINARY_CLOUD_NAME: "{{ CLOUDINARY_CLOUD_NAME }}"
        CLOUDINARY_API_KEY: "{{ CLOUDINARY_API_KEY }}"
        CLOUDINARY_API_SECRET: "{{ CLOUDINARY_API_SECRET }}"
        # Ansible truyền IMAGE_TAG xuống stack từ Jenkinsfile
        IMAGE_TAG: "{{ IMAGE_TAG | default('latest') }}"


