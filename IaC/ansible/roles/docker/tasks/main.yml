#Chứa danh sách các tác vụ chính (install, config, start service). Đây là file quan trọng nhất, thường có main.yml.
- name: Install required packages
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present #chỉ cài nếu chưa có
    update_cache: true #cập nhật cache apt trước khi cài, giống như bạn gõ sudo apt-get update

- name: Add Docker GPG key
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Add Docker repository
  apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present

- name: Install Docker CE
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present #nếu trước đó đã cài thì lần sau chạy sẽ bỏ qua
    update_cache: true

- name: Add user to docker group
  user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true #chỉ thêm group nếu chưa có

- name: Start and enable Docker
  systemd:
    name: docker
    state: started #chỉ start nếu chưa chạy
    enabled: true #chỉ enable nếu chưa enable
