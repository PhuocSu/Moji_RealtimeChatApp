name: CI Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # ============================================================
  # JOB 1: Sonarqube scan (SAST/Code quality) + Snyk scan (dependencies vulnerabilities)
  # ============================================================
  source-code-analysis:
    name: Source Code Analysis
    runs-on: self-hosted
    permissions:
      security-events: write
    env:
      SONARQUBE_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      PROJECT_NAME: Moji_RealtimeChatApp
      PROJECT_KEY: PhuocSu_Moji_RealtimeChatApp_26ee018d-c035-4122-96a6-27550766bd7f
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      
      - name: Ensure SonarQube server is running
        run: |
          # chạy container SonarQube nếu chưa có
          if [ "$(sudo docker ps -q -f name=sonarqube)" ]; then
            echo "SonarQube is already running."
          else
            echo "SonarQube is not running. Starting SonarQube..."
            sudo docker start sonarqube
          fi

      - name: SonarQube scan (SAST/Code quality)
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ env.PROJECT_KEY }}
            -Dsonar.projectName=${{ env.PROJECT_NAME }}

      - name: SonarQube Quality Gate check
        uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Snyk scan (dependencies vulnerabilities)
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --all-projects --severity-threshold=high --sarif-file-output=snyk.sarif

      - name: Upload Snyk results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: snyk.sarif
  # ============================================================
  # JOB 2: Build image
  # ============================================================        
  build-image:
    name: Build Docker Image
    needs: source-code-analysis          # ← chờ source-code-analysis xong mới chạy
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      #Dùng ${{ github.sha }} giúp bạn trace được image build từ 
      #commit nào → rất hữu ích khi deploy.
      - name: Build backend image
        run: sudo docker build -t chatapp-backend:${{ github.sha }} -t chatapp-backend:latest ./backend

      - name: Build frontend image
        run: sudo docker build -t chatapp-frontend:${{ github.sha }} -t chatapp-frontend:latest ./frontend
  # ============================================================
  # JOB 3: trivy scan image
  # ============================================================
  image-scan:
    name: Scan build Docker image 
    needs: build-image         # ← chờ build-image xong mới chạy
    runs-on: self-hosted
    steps:
      - name: Scan backend image
        uses: aquasecurity/trivy-action@master
        with:
          # Image to scan (use commit SHA for traceability)
          image-ref: 'chatapp-backend:${{ github.sha }}'
          # Output format for GitHub Security tab integration
          format: 'sarif'
          output: 'trivy-backend.sarif'
          # Only fail on HIGH and CRITICAL vulnerabilities
          severity: 'HIGH,CRITICAL'
          # Ignore vulnerabilities without fixes
          ignore-unfixed: true

      # Upload results to GitHub Security tab
      - name: Upload backend scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-backend.sarif'

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@master
        with:
          # Image to scan (use commit SHA for traceability)
          image-ref: 'chatapp-frontend:${{ github.sha }}'
          # Output format for GitHub Security tab integration
          format: 'sarif'
          output: 'trivy-frontend.sarif'
          # Only fail on HIGH and CRITICAL vulnerabilities
          severity: 'HIGH,CRITICAL'
          # Ignore vulnerabilities without fixes
          ignore-unfixed: true

      # Upload results to GitHub Security tab
      - name: Upload frontend scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-frontend.sarif'
  

      